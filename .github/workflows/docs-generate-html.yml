name: "Generate HTML"
run-name: "Generate ${{ inputs.publish-env != '' && inputs.publish-env || (github.ref_name == vars.DOCS_PROD_BRANCH && 'prod' || 'dev') }} HTML from ${{ github.ref_name }}"

permissions:
  contents: read

# Builds, verifies, and publishes docs for ONE environment, as a run entirely independent
# of any other environment's run. Triggered (via the API, not a workflow_call) by
# docs-trigger-builds.yml, once per environment that applies to a given push (dev, prod, or both) -
# so if dev's run fails, prod's run is completely unaffected, and vice versa.
#
# No build-ref input: the git ref to build from is always whatever ref this run was
# itself dispatched against (the "Use workflow from" branch when triggered manually, or
# docs-trigger-builds.yml's own `ref:` when triggered automatically - which it always sets
# to the same value it also used to pass as a build-ref input here, so that separate input
# never actually carried any information github.ref_name didn't already have). Reading
# github.ref_name directly instead removes a second, redundant "which branch" box from
# manual dispatch.
on:
  workflow_dispatch:
    inputs:
      publish-env:
        description: 'dev or prod. Leave blank to infer from the branch - only needed if your dev and prod branches are the same (branch name alone cannot tell the two builds apart then).'
        type: choice
        required: false
        default: ''
        options:
        - ''
        - 'dev'
        - 'prod'

jobs:

  # Resolves publish-env (dev/prod) once, so neither docs-build nor publish-html
  # duplicates the override-or-derive logic.
  resolve-env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      publish-env: ${{ steps.resolve.outputs.publish-env }}
    steps:
      - name: Resolve publish-env
        id: resolve
        env:
          PUBLISH_ENV_OVERRIDE: ${{ inputs.publish-env }}
          PROD_BRANCH: ${{ vars.DOCS_PROD_BRANCH }}
        run: |
          if [[ -n "${PUBLISH_ENV_OVERRIDE}" ]]; then
            publish_env="${PUBLISH_ENV_OVERRIDE}"
          elif [[ "${GITHUB_REF_NAME}" == "${PROD_BRANCH}" ]]; then
            publish_env="prod"
          else
            publish_env="dev"
          fi

          echo "publish-env=${publish_env}" >> $GITHUB_OUTPUT

  docs-build:
    name: Generate HTML
    needs: resolve-env
    uses: neo4j/docs-tools/.github/workflows/reusable-docs-build.yml@v2
    with:
      package-script: 'verify:publish'
      build-ref: ${{ github.ref_name }}
      fetch-depth: 0
      publish-env: ${{ needs.resolve-env.outputs.publish-env }}

  docs-verify:
    name: Verify HTML
    needs: docs-build
    uses: neo4j/docs-tools/.github/workflows/reusable-docs-verify.yml@v2
    with:
      failOnWarnings: true

  # Hand off to docs-publish (a separate repo) to actually publish this run's "docs"
  # artifact. versionless: "true" because this repo has no version segment (antora.yml's
  # version: ~) - preserved from this repo's own pre-template-refresh docs-generate-html.yml.
  publish-html:
    name: Publish HTML
    needs: [docs-verify, resolve-env]
    runs-on: ubuntu-latest
    steps:
      - name: Publish to ${{ needs.resolve-env.outputs.publish-env }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 #v4
        with:
          token: ${{ secrets.DOCS_DISPATCH_TOKEN }}
          repository: neo4j/docs-publish
          event-type: publish-html
          client-payload: |-
            {
              "org": "${{ github.repository_owner }}",
              "repo": "${{ github.event.repository.name }}",
              "run_id": "${{ github.run_id }}",
              "publish_env": "${{ needs.resolve-env.outputs.publish-env }}",
              "versionless": "true"
            }
